name: CI e deploy VPS
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      sonar:
        description: Executar SonarQube nesta branch (sem deploy)
        type: boolean
        default: false
      deploy:
        description: Fazer deploy do commit validado na VPS (somente develop)
        type: boolean
        default: false

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: '0'

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: 1. Validar, testar e gerar cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter cÃ³digo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependÃªncias
        run: npm ci --no-audit --no-fund
      - name: Auditar dependÃªncias de produÃ§Ã£o
        run: npm audit --omit=dev --audit-level=high
      - name: Validar TypeScript e scripts de deploy
        run: |
          npm run typecheck
          for file in scripts/ci/*.sh; do bash -n "$file"; done
          shellcheck -S warning scripts/ci/*.sh
      - name: Validar HTML de entrada
        run: npm run validate:html
      - name: Testar com cobertura real
        run: npm run test:coverage
      - name: Compilar aplicaÃ§Ã£o SSR
        run: npm run build:coverage
      - name: Obter backend para testes isolados
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Portela-Dev/o-espertinho-backend
          # Compatible backend contract including configurable offer ratings; may be overridden for integration testing.
          ref: ${{ vars.E2E_BACKEND_REF || '2b0b81cfb2d111f9e4a7de917a0ea3c20c0d053b' }}
          path: .ci-backend
          persist-credentials: false
      - name: Preparar API de teste e Chromium
        run: |
          npm --prefix .ci-backend ci --no-audit --no-fund
          npm --prefix .ci-backend run build
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Testar aplicaÃ§Ã£o web compilada em navegador
        env:
          E2E_BROWSER_CHANNEL: chromium
          COLLECT_BROWSER_COVERAGE: '1'
          CI_API_PORT: '3100'
          CI_WEB_PORT: '4300'
        run: node scripts/ci/test-web.mjs
      - name: Mesclar cobertura do navegador e Node
        run: npm run coverage:merge
      - name: Publicar cobertura e relatÃ³rios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_id }}
          path: |
            coverage/**/lcov.info
            reports/web/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 1

  sonarqube:
    name: 2. SonarQube e Quality Gate
    needs: validate
    if: (github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && inputs.sonar)
    runs-on: [self-hosted, Windows, X64, windows-portela-dev]
    timeout-minutes: 15
    concurrency:
      group: sonar-${{ github.repository }}-develop
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
    steps:
      - name: Obter histÃ³rico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Baixar cobertura do mesmo commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports-${{ github.run_id }}
          path: reports
      - name: Conferir configuraÃ§Ã£o e servidor
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) { throw 'Configure SONAR_TOKEN nos secrets do repositÃ³rio.' }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) { throw 'Configure SONAR_HOST_URL nas variables do repositÃ³rio.' }
          if (-not (Test-Path -LiteralPath 'reports/coverage/lcov.info')) { throw 'Cobertura do commit nÃ£o encontrada.' }
          $headers = @{ 'ngrok-skip-browser-warning' = 'true'; Accept = 'application/json' }
          $response = Invoke-WebRequest -UseBasicParsing -Uri ($env:SONAR_HOST_URL.TrimEnd('/') + '/api/system/status') -Headers $headers -TimeoutSec 30
          try { $status = $response.Content | ConvertFrom-Json } catch { throw 'A URL do SonarQube nÃ£o retornou JSON. Confira o tÃºnel ngrok e sua configuraÃ§Ã£o de acesso.' }
          if ($status.status -ne 'UP') { throw 'SonarQube indisponÃ­vel.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            try {
              Write-Output 'Diagnóstico da análise anterior; o Quality Gate desta execução será calculado pelo scanner.'
              $key = ((Get-Content sonar-project.properties | Select-String '^sonar.projectKey=').Line -split '=', 2)[1]
              $authHeaders = @{ Authorization = 'Bearer ' + $env:SONAR_TOKEN; 'ngrok-skip-browser-warning' = 'true' }
              $base = $env:SONAR_HOST_URL.TrimEnd('/')
              $gate = Invoke-RestMethod -Uri ($base + '/api/qualitygates/project_status?projectKey=' + $key) -Headers $authHeaders -TimeoutSec 30
              $gate.projectStatus | ConvertTo-Json -Depth 5
              $issues = Invoke-RestMethod -Uri ($base + '/api/issues/search?componentKeys=' + $key + '&resolved=false&ps=100') -Headers $authHeaders -TimeoutSec 30
              $issues.issues | Select-Object rule,component,line,message | ConvertTo-Json -Depth 5
            } catch { Write-Warning 'Não foi possível consultar o diagnóstico anterior. A análise seguirá normalmente.' }
          }
      - name: Preparar verificaÃ§Ã£o de assinatura do scanner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command gpg.exe -ErrorAction SilentlyContinue) -or -not (Get-Command dirmngr.exe -ErrorAction SilentlyContinue)) {
            $git = Get-Command git.exe -ErrorAction Stop
            $gitTools = Join-Path (Split-Path -Parent (Split-Path -Parent $git.Source)) 'usr/bin'
            foreach ($tool in @('gpg.exe', 'dirmngr.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $gitTools $tool))) { throw "Ferramenta ausente: $tool" }
            }
            [IO.File]::AppendAllText($env:GITHUB_PATH, $gitTools + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          }
      - name: Analisar e aguardar Quality Gate
        id: sonar
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Mostrar motivos do Quality Gate desta análise
        if: failure() && steps.sonar.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = ((Get-Content sonar-project.properties | Select-String '^sonar.projectKey=').Line -split '=', 2)[1]
          $headers = @{ Authorization = 'Bearer ' + $env:SONAR_TOKEN; 'ngrok-skip-browser-warning' = 'true' }
          $base = $env:SONAR_HOST_URL.TrimEnd('/')
          $gate = Invoke-RestMethod -Uri ($base + '/api/qualitygates/project_status?projectKey=' + $key) -Headers $headers -TimeoutSec 30
          $gate.projectStatus | ConvertTo-Json -Depth 5
          $issues = Invoke-RestMethod -Uri ($base + '/api/issues/search?componentKeys=' + $key + '&resolved=false&inNewCodePeriod=true&ps=100') -Headers $headers -TimeoutSec 30
          $issues.issues | Select-Object rule,component,line,message | ConvertTo-Json -Depth 5

  image:
    name: 3. Compilar e validar imagem Docker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter cÃ³digo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js para o manifesto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Compilar, testar e empacotar
        run: bash scripts/ci/package-image.sh
      - name: Publicar imagem e manifesto com SHA-256
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vps-bundle/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  deploy:
    name: 4. Deploy independente por SSH
    needs: [validate, sonarqube, image]
    if: github.ref == 'refs/heads/develop' && ((github.event_name == 'push' && vars.VPS_AUTO_DEPLOY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: vps-${{ github.repository }}-production
      cancel-in-progress: false
    steps:
      - name: Obter scripts do commit validado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baixar imagem validada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vps-bundle
      - name: Verificar e implantar
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/ci/deploy-vps.sh
